<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting to G.K. SAWMILL...</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      (function() {
        var pathSegmentsToKeep = 1; // '/GK-SAWMILL'
        var l = window.location;
        // Redirect to the repository base URL preserving hash/query
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body>
    <p style="font-family: sans-serif; text-align: center; margin-top: 50px;">
      Redirecting to <a href="./">G.K. SAWMILL Application</a>...
    </p>
  </body>
</html>
