<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14281e"/>
      <stop offset="50%" stop-color="#1e3a2b"/>
      <stop offset="100%" stop-color="#0b130e"/>
    </linearGradient>
    <radialGradient id="timberGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0a96d"/>
      <stop offset="40%" stop-color="#d4a373"/>
      <stop offset="70%" stop-color="#925c38"/>
      <stop offset="100%" stop-color="#58311a"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="50%" stop-color="#d4a373"/>
      <stop offset="100%" stop-color="#b07d4b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#52b788"/>
      <stop offset="60%" stop-color="#2d6a4f"/>
      <stop offset="100%" stop-color="#1b4332"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.5"/>

  <!-- Centered Saw Blade & Timber Rings -->
  <g transform="translate(256, 256)">
    <!-- Saw Teeth -->
    <g fill="url(#goldGrad)" opacity="0.95">
      <polygon points="0,-190 16,-170 -16,-170"/>
      <polygon points="0,-190 16,-170 -16,-170" transform="rotate(22.5)"/>
      <polygon points="0,-190 16,-170 -16,-170" transform="rotate(45)"/>
      <polygon points="0,-190 16,-170 -16,-170" transform="rotate(67.5)"/>
      <polygon points="0,-190 16,-170 -16,-170" transform="rotate(90)"/>
      <polygon points="0,-190 16,-170 -16,-170" transform="rotate(112.5)"/>
      <polygon points="0,-190 16,-170 -16,-170" transform="rotate(135)"/>
      <polygon points="0,-190 16,-170 -16,-170" transform="rotate(157.5)"/>
      <polygon points="0,-190 16,-170 -16,-170" transform="rotate(180)"/>
      <polygon points="0,-190 16,-170 -16,-170" transform="rotate(202.5)"/>
      <polygon points="0,-190 16,-170 -16,-170" transform="rotate(225)"/>
      <polygon points="0,-190 16,-170 -16,-170" transform="rotate(247.5)"/>
      <polygon points="0,-190 16,-170 -16,-170" transform="rotate(270)"/>
      <polygon points="0,-190 16,-170 -16,-170" transform="rotate(292.5)"/>
      <polygon points="0,-190 16,-170 -16,-170" transform="rotate(315)"/>
      <polygon points="0,-190 16,-170 -16,-170" transform="rotate(337.5)"/>
    </g>

    <!-- Timber Wood Disc -->
    <circle r="165" fill="url(#timberGrad)" stroke="#3a1e0f" stroke-width="5"/>
    <circle r="138" fill="none" stroke="#6f3d1e" stroke-width="3" opacity="0.6"/>
    <circle r="110" fill="none" stroke="#e0a96d" stroke-width="2.5" opacity="0.6"/>
    <circle r="80" fill="none" stroke="#58311a" stroke-width="2.5" opacity="0.7"/>

    <!-- Central Arbor Plate -->
    <circle r="44" fill="#14281e" stroke="url(#goldGrad)" stroke-width="4"/>
    <circle r="18" fill="url(#goldGrad)"/>

    <!-- Evergreen Timber Crest -->
    <rect x="-9" y="32" width="18" height="48" rx="4" fill="#3a1e0f"/>
    <polygon points="0,-15 65,45 -65,45" fill="url(#emeraldGrad)"/>
    <polygon points="0,-55 52,-2 -52,-2" fill="url(#emeraldGrad)"/>
    <polygon points="0,-90 38,-40 -38,-40" fill="url(#emeraldGrad)"/>
    <polygon points="0,-106 6,-94 18,-94 9,-85 13,-72 0,-81 -13,-72 -9,-85 -18,-94 -6,-94" fill="url(#goldGrad)"/>
  </g>
</svg>
